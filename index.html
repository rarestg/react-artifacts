<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/icon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icon-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tools.rares.blog — small self-contained web tools</title>
    <meta name="description" content="A small gallery of self-contained web tools built as React artifacts." />
    <script>
      (() => {
        try {
          const base = '%BASE_URL%'.replace(/\/$/, '');
          const pathname = window.location.pathname;
          const stripped = base && pathname.startsWith(base) ? pathname.slice(base.length) : pathname;
          const isStandalone = /^\/artifact\/[^/]+\/?$/.test(stripped);

          // First-visit mobile boots straight into the black session notice; pre-paint the
          // page so the pre-React frames match instead of flashing white. Own try/catch:
          // blocked storage means the notice never shows (treated as seen), so skip the
          // paint but keep theming. React clears this via clearMobileBootPaint in
          // src/lib/mobileDisclaimerGate.ts; tests/app/mobileBootPaint.test.ts pins the
          // literals below to the TS constants.
          try {
            if (
              !isStandalone &&
              window.matchMedia('(max-width: 767.98px)').matches &&
              !new URLSearchParams(window.location.search).has('artifact') &&
              sessionStorage.getItem('tools:mobile-disclaimer:v1') === null
            ) {
              document.documentElement.style.backgroundColor = '#0a0a0a';
            }
          } catch {
            // no-op
          }

          const stored = localStorage.getItem('artifact-theme');
          const storedTheme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          const theme = isStandalone ? 'system' : storedTheme;
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const shouldDark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', shouldDark);
          document.documentElement.style.colorScheme = shouldDark ? 'dark' : 'light';
        } catch {
          // no-op
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
